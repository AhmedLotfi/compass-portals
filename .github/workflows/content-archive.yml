name: Archive compassint.org

# Crawls compassint.org politely and commits what it downloaded, so every later stage (normalize,
# sync, build) can run offline from source-archive/:
#   1. render: compassint.org is a client-rendered Angular app, so each page is opened in headless
#      Chromium, one at a time; the rendered HTML, every response the app loads (API data, images,
#      fonts) and a screenshot per page are archived (reports/rendered.md)
#   2. discover: fingerprint and inventory, reading the rendered pages (reports/probe.json, inventory)
#   3. fetch: images and documents the pages reference that the browser didn't load
# Runs only when started by hand (Actions → Archive compassint.org → Run workflow), on the branch
# chosen there, and pushes one commit to that branch.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Most pages to render
        default: '150'

permissions:
  contents: write

concurrency:
  group: content-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Bounded so the job always reaches the commit step: each page has a 45 s budget, and no new
      # page starts after 35 minutes; what was rendered by then is kept.
      - name: Render every page in Chromium
        timeout-minutes: 45
        run: npm run content:render -- --max-pages="${{ inputs.max_pages }}" --budget-minutes=35

      # Reads the rendered pages from the archive in place of the empty app shell.
      - name: Inventory the site
        if: always()
        run: npm run content:discover

      - name: Download the images and documents the pages reference
        if: always()
        run: npm run content:fetch

      - name: Upload the inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: reports/
          if-no-files-found: ignore

      - name: Commit the archive and the inventory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in source-archive reports/probe.json reports/inventory.json reports/inventory.md reports/rendered.md; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "The archive is unchanged."
            exit 0
          fi
          git commit -m "chore(content): archive compassint.org ($(date -u +%Y-%m-%d))"
          # The branch may have moved while the crawl ran.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
