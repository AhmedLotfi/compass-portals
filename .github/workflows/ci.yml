name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: |
          npm run lint
          npm run lint:design

      - name: Unit tests (against the synthetic fixture snapshot)
        run: npm test

      - name: Tooling type-check and tests
        run: |
          npm run typecheck:tools
          npm run test:tools

      # The real snapshot (src/content) exists once compassint.org has been synced.
      # Until then, the app is built against the synthetic fixture to prove it compiles and prerenders.
      - name: Pick the content snapshot
        run: |
          if [ -f src/content/site.json ]; then
            echo "CONTENT_DIR=src/content" >> "$GITHUB_ENV"
          else
            echo "CONTENT_DIR=.cache/fixture/content" >> "$GITHUB_ENV"
          fi

      # Includes the post-build checks (every page prerendered, canonical/robots) and the sitemap, llms.txt
      # and hosting rules.
      # Image variants (AVIF/WebP at every width) take minutes to encode; they only change with
      # the snapshot's media list, and the build skips files that already exist.
      - name: Cache image variants
        uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ hashFiles('src/content/media.json', 'tools/media/build.ts') }}
          restore-keys: media-

      - name: Build (static prerender)
        run: |
          if [ "$CONTENT_DIR" = src/content ]; then npm run build; else npm run build:fixture; fi

      # Parity and provenance (the hard rule), links, sitemap and HTML validity of the built pages.
      - name: Verify the build against the snapshot
        run: npm run verify:dist -- --content="$CONTENT_DIR"

      - name: Hosting rules (real nginx and Apache, and the e2e server)
        run: npm run verify:hosting -- --content="$CONTENT_DIR"

      # Pinned to the Chromium build of @playwright/test 1.56.1.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (desktop and mobile)
        run: npm run e2e
        env:
          E2E_CONTENT: ${{ env.CONTENT_DIR }}

      # Uses the runner's Google Chrome. Fails on accessibility, best practices, SEO, CLS and
      # performance below 0.9; timing targets are reported as warnings.
      - name: Lighthouse (home, listing, product, contact; mobile and desktop)
        run: npm run lighthouse -- --content="$CONTENT_DIR"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            reports/lighthouse/
          if-no-files-found: ignore
