name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: |
          npm run lint
          npm run lint:design

      - name: Unit tests (against the synthetic fixture snapshot)
        run: npm test

      - name: Tooling type-check and tests
        run: |
          npm run typecheck:tools
          npm run test:tools

      # The real snapshot (src/content) exists once compassint.org has been synced;
      # until then the app is built against the synthetic fixture to prove it compiles and prerenders.
      - name: Build (static prerender)
        run: |
          if [ -f src/content/site.json ]; then npm run build; else npm run build:fixture; fi
