<a class="skip-link" [href]="mainHref()" (click)="skipToMain($event)">{{
  'skipToContent' | copy
}}</a>
<app-site-header />
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<!-- Prerendered; the footer's code (links, brand marks) hydrates when it scrolls into view. -->
@defer (on immediate; hydrate on viewport) {
  <app-site-footer />
}
